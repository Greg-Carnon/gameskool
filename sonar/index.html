<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#020a12">
  <meta property="og:title" content="Sonar">
  <meta property="og:description" content="It is dark down here. Ping to see. Seeing costs air.">
  <title>Sonar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#020a12; --teal:#7ff5e6; --paper:#e6fbf8; --gold:#fff6d0; }
    html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; overscroll-behavior: none; }
    body { font-family: Inter, system-ui, sans-serif; color: var(--paper); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; position: fixed; inset: 0; }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(2, 10, 18, 0.78); padding: 20px; z-index: 10; overflow-y: auto; }
    .overlay[hidden] { display: none; }
    .card { max-width: 340px; width: 100%; }
    h1 { font-size: 34px; font-weight: 800; letter-spacing: 0.42em; margin: 0 0 4px; padding-left: 0.42em; color: var(--teal); text-shadow: 0 0 24px rgba(127,245,230,0.6); }
    .sub { font-size: 13px; opacity: 0.7; margin: 0 0 14px; }
    p { margin: 6px 0; font-size: 15px; line-height: 1.45; opacity: 0.9; }
    p b { color: var(--teal); }
    .big { font-size: 56px; font-weight: 800; line-height: 1; margin: 6px 0; }
    .cause { color: #ff8a8a; font-weight: 600; }
    .bank { color: var(--gold); font-weight: 700; }
    button { margin-top: 14px; font: inherit; font-weight: 800; font-size: 18px; padding: 12px 32px; border-radius: 999px; border: 2px solid var(--teal); background: transparent; color: var(--teal); box-shadow: 0 0 24px rgba(127,245,230,0.25); }
    button:active { background: var(--teal); color: var(--ink); }
    button.secondary { border-color: rgba(230,251,248,0.25); color: var(--paper); box-shadow: none; font-size: 15px; padding: 10px 20px; margin-left: 8px; }
    .shopbox { text-align: left; background: rgba(127,245,230,0.06); border: 1px solid rgba(127,245,230,0.15); border-radius: 16px; padding: 12px 14px; margin: 12px 0 8px; }
    .shopbox h2 { font-size: 12px; letter-spacing: 0.2em; margin: 0 0 8px; opacity: 0.8; display: flex; justify-content: space-between; }
    .shopbox h2 span { color: var(--gold); }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-top: 1px solid rgba(127,245,230,0.1); }
    .row:first-of-type { border-top: 0; }
    .row b { display: block; font-size: 14px; }
    .row small { display: block; font-size: 11px; opacity: 0.6; }
    .row .tiers { font-size: 10px; color: var(--teal); letter-spacing: 2px; }
    .row .buy { margin: 0; font-size: 13px; padding: 7px 12px; border-width: 1.5px; box-shadow: none; }
    .row .buy:disabled { opacity: 0.35; }
    .achs { display: flex; justify-content: center; gap: 6px; margin: 6px 0 4px; }
    .ach { font-size: 20px; filter: grayscale(1); opacity: 0.25; }
    .ach.on { filter: none; opacity: 1; }
    .hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 14px; right: 14px; display: flex; align-items: center; gap: 10px; pointer-events: none; z-index: 5; }
    .bar { flex: 1; height: 10px; border-radius: 999px; background: rgba(127,245,230,0.12); overflow: hidden; }
    .bar div { height: 100%; width: 100%; background: var(--teal); border-radius: 999px; transition: width .2s linear, background .3s; }
    .lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.2em; opacity: 0.7; }
    .pill { font-weight: 800; font-size: 15px; white-space: nowrap; }
    .hud2 { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 26px); left: 14px; right: 14px; display: flex; justify-content: space-between; pointer-events: none; z-index: 5; font-size: 13px; font-weight: 700; opacity: 0.85; }
    .hud2 .boss { color: #ff9a5c; letter-spacing: 3px; }
    #soundBtn { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 6; margin: 0; padding: 8px 10px; font-size: 16px; border-color: rgba(127,245,230,0.25); box-shadow: none; }
    .banner { position: fixed; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; z-index: 7; opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .35s; }
    .banner.show { opacity: 1; transform: none; }
    .banner b { display: block; font-size: 22px; letter-spacing: 0.12em; color: var(--teal); text-shadow: 0 0 20px rgba(127,245,230,0.6); }
    .banner span { display: block; font-size: 14px; opacity: 0.85; margin-top: 4px; }
    .award { position: fixed; left: 50%; bottom: 80px; transform: translate(-50%, 10px); background: var(--gold); color: var(--ink); font-weight: 800; font-size: 13px; padding: 8px 14px; border-radius: 999px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 7; white-space: nowrap; }
    .award.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud"><span class="lbl">O₂</span><div class="bar"><div id="o2"></div></div><span class="pill" id="depth">20 m</span></div>
  <div class="hud2"><span id="pearls">🫧 0/4</span><span id="bossHud" hidden>ANGLER <span class="boss" id="bossHp">●●●</span></span></div>
  <div class="banner" id="banner"><b id="bannerTitle"></b><span id="bannerSub"></span></div>
  <div class="award" id="award"></div>
  <button id="soundBtn">🔊</button>
  <div id="start" class="overlay">
    <div class="card">
      <h1>SONAR</h1>
      <p class="sub" id="bestDepth">No dives yet</p>
      <p>It is dark down here. <b>Tap</b> to dive there and send a ping.</p>
      <p><b>Hold</b> for a big ping. Pearls give air and open the hatch. Go deeper.</p>
      <div class="shopbox">
        <h2>UPGRADES <span>🫧 <span id="bank">0</span></span></h2>
        <div id="shop"></div>
      </div>
      <div class="achs" id="achievements"></div>
      <button id="startBtn">Dive</button>
    </div>
  </div>
  <div id="over" class="overlay" hidden>
    <div class="card">
      <div class="big" id="finalDepth">0 m</div>
      <p class="cause" id="cause"></p>
      <p id="diveLog"></p>
      <p class="bank" id="bankLine"></p>
      <p id="bestLine"></p>
      <button id="againBtn">Dive again</button>
      <div><button id="menuBtn" class="secondary">Upgrades</button><button id="shareBtn" class="secondary">Share</button></div>
    </div>
  </div>
  <script type="module" src="/src/sonar/main.ts"></script>
</body>
</html>
