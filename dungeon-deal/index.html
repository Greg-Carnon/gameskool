<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14261c">
  <title>Dungeon Deal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --felt:#1b3a2a; --felt2:#0e2018; --gold:#f2c94c; --gold2:#8a5a00; --paper:#f3e6c8; --ink:#2a1e14; --red:#c0392b; }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { font-family: Inter, system-ui, sans-serif; color: var(--paper); background: radial-gradient(ellipse at 50% 30%, var(--felt), var(--felt2) 75%); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; transition: background .15s; }
    body.hit { background: radial-gradient(ellipse at 50% 30%, #4a1f1f, var(--felt2) 75%); }
    .table { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
    .top { display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
    .top .floor { font-family: Cinzel, serif; font-size: 18px; color: var(--gold); letter-spacing: 0.06em; }
    .hp { font-size: 22px; color: #ff6b6b; letter-spacing: 2px; }
    .hp .dim { opacity: 0.25; }
    .stats { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; opacity: 0.9; }
    .stats b { color: var(--gold); font-size: 16px; }
    .mid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; justify-items: center; }
    .deck, .card { width: 150px; height: 220px; border-radius: 14px; position: relative; }
    .deck { background: repeating-linear-gradient(45deg, #5a1e1e 0 6px, #4a1616 6px 12px); border: 4px solid var(--gold2); box-shadow: 0 6px 0 #3a1010, 0 10px 0 #2a0c0c, 0 18px 24px rgba(0,0,0,0.5); cursor: pointer; display: grid; place-items: center; }
    .deck:active { transform: translateY(3px); }
    .deck .inner { width: 110px; height: 180px; border: 2px solid rgba(242,201,76,0.5); border-radius: 10px; display: grid; place-items: center; font-family: Cinzel, serif; font-weight: 900; font-size: 30px; color: var(--gold); text-align: center; line-height: 1; }
    .deck .inner small { display: block; font-family: Inter, sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 0.15em; margin-top: 8px; color: var(--paper); opacity: 0.8; }
    .card { perspective: 900px; }
    .card .face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; transition: transform .35s cubic-bezier(.2,.8,.3,1.2); }
    .card .back { background: repeating-linear-gradient(45deg, #5a1e1e 0 6px, #4a1616 6px 12px); border: 4px solid var(--gold2); box-sizing: border-box; }
    .card .front { background: var(--paper); border: 4px solid var(--gold2); box-sizing: border-box; transform: rotateY(180deg); display: grid; grid-template-rows: 1fr auto; padding: 14px 10px 12px; color: var(--ink); box-shadow: 0 12px 24px rgba(0,0,0,0.45); }
    .card.flipped .back { transform: rotateY(180deg); }
    .card.flipped .front { transform: rotateY(0); }
    .card .front svg { width: 100%; height: 100%; max-height: 120px; }
    .card .label { font-family: Cinzel, serif; font-weight: 700; font-size: 13px; text-align: center; }
    .card.kind-monster .front { background: #efdcd2; }
    .card.kind-gold .front { background: #f7ebc4; }
    .card.kind-potion .front { background: #dff3ee; }
    .card.kind-trap .front { background: #e2e2e2; }
    .bottom { text-align: center; }
    .monsters { font-size: 13px; opacity: 0.9; margin-bottom: 10px; }
    .monsters b { color: #ff6b6b; font-size: 18px; }
    button { font: inherit; font-weight: 800; font-size: 18px; padding: 14px 28px; border-radius: 999px; border: 0; background: var(--gold); color: var(--ink); box-shadow: 0 6px 0 var(--gold2); width: 100%; max-width: 340px; }
    button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--gold2); }
    button:disabled { opacity: 0.4; box-shadow: none; }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(8, 18, 12, 0.85); padding: 24px; z-index: 10; }
    .overlay[hidden] { display: none; }
    .panel { max-width: 320px; }
    h1 { font-family: Cinzel, serif; font-weight: 900; font-size: 38px; color: var(--gold); margin: 0 0 12px; line-height: 1.05; text-shadow: 0 4px 0 #3a1010; }
    p { margin: 8px 0; font-size: 16px; line-height: 1.45; }
    p b { color: var(--gold); }
    .big { font-family: Cinzel, serif; font-weight: 900; font-size: 58px; color: var(--gold); line-height: 1; margin: 6px 0; }
    .toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(0.8); background: var(--paper); color: var(--ink); font-weight: 800; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .15s, transform .15s; pointer-events: none; z-index: 8; }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .toast.good { background: var(--gold); }
  </style>
</head>
<body>
  <div class="table">
    <div>
      <div class="top"><span class="floor" id="floor">Floor 1</span><span class="hp" id="hp"></span></div>
      <div class="stats"><span>Carrying <b id="carried">0</b></span><span>Banked <b id="banked">0</b></span><span id="remain"></span></div>
    </div>
    <div class="mid">
      <div class="deck" id="deck"><div class="inner">DRAW<small>TAP THE DECK</small></div></div>
      <div class="card" id="card"><div class="face back"></div><div class="face front"><div id="cardFace"></div><div class="label" id="cardLabel"></div></div></div>
    </div>
    <div class="bottom">
      <div class="monsters"><b id="monsters">6</b> monsters still in the deck</div>
      <button id="leaveBtn">Nothing to take yet</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div id="start" class="overlay">
    <div class="panel">
      <h1>Dungeon Deal</h1>
      <p>The deck is the dungeon. <b>Tap</b> to turn the next card.</p>
      <p>Gold adds up. Monsters bite. You can leave any time and bank what you carry.</p>
      <p>Die, and the dungeon keeps it all.</p>
      <button id="startBtn">Enter</button>
    </div>
  </div>
  <div id="over" class="overlay" hidden>
    <div class="panel">
      <p>You banked</p>
      <div class="big" id="finalBanked">0</div>
      <p id="floorLine"></p>
      <p id="bestLine"></p>
      <button id="againBtn">Enter again</button>
    </div>
  </div>
  <script type="module" src="/src/dungeon-deal/main.ts"></script>
</body>
</html>
