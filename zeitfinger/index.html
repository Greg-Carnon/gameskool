<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f7f1e6">
  <title>Zeitfinger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#1a1a1a; --paper:#f7f1e6; --red:#e63946; }
    html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; overscroll-behavior: none; }
    body { font-family: Inter, system-ui, sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; position: fixed; inset: 0; }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(247, 241, 230, 0.7); padding: 24px; z-index: 10; }
    .overlay[hidden] { display: none; }
    .card { max-width: 320px; background: var(--ink); color: var(--paper); border-radius: 6px; padding: 28px 24px; box-shadow: 8px 8px 0 var(--red); }
    h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; margin: 0; line-height: 1; text-transform: uppercase; }
    h1 span { color: var(--red); }
    p { margin: 12px 0 0; font-size: 16px; line-height: 1.45; }
    p b { color: var(--red); }
    .big { font-size: 60px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin: 4px 0; }
    button { margin-top: 20px; font: inherit; font-weight: 800; font-size: 18px; padding: 12px 30px; border-radius: 4px; border: 0; background: var(--red); color: #fff; box-shadow: 4px 4px 0 var(--paper); }
    button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--paper); }
    .hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 14px; pointer-events: none; z-index: 5; }
    .pill { background: var(--ink); color: var(--paper); padding: 6px 14px; font-weight: 800; font-size: 18px; border-radius: 4px; }
    .pill.red { background: var(--red); color: #fff; transition: opacity .2s; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud"><span class="pill" id="score">0</span><span class="pill red" id="mult">×1.0</span></div>
  <div id="start" class="overlay">
    <div class="card">
      <h1>Zeit<span>finger</span></h1>
      <p>Time only moves while your finger is <b>on the screen</b>.</p>
      <p>Let go to think. Hold to move. The longer you hold without stopping, the more you score.</p>
      <button id="startBtn">Hold to begin</button>
    </div>
  </div>
  <div id="over" class="overlay" hidden>
    <div class="card">
      <p>Time's up.</p>
      <div class="big" id="finalScore">0</div>
      <p id="holdLine"></p>
      <p id="bestLine"></p>
      <button id="againBtn">Again</button>
    </div>
  </div>
  <script type="module" src="/src/zeitfinger/main.ts"></script>
</body>
</html>
